# Build the image on Cloud Build rather than pushing one from a workstation:
# a local `docker push` fails on a slow uplink (TLS handshake timeout). This
# uploads a few MB of source instead.
#
# Measured compressed size (registry manifest, layers + config):
#   v13  147.7 MB   before pruning build-only Cesium
#   v14  117.1 MB   after
# The older "~900MB" note here was an estimate, never a measurement.
#
# GOOGLE_MAPS_API_KEY is a BUILD argument, not a runtime variable: vite's
# `define` bakes it into the browser bundle, so supplying it at runtime only
# produces an image whose globe cannot authenticate.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      # Not the plain Dockerfile: that is upstream's compose dev container.
      - -f
      - Dockerfile.cloudrun
      - --build-arg
      - GOOGLE_MAPS_API_KEY=${_GOOGLE_MAPS_API_KEY}
      - --build-arg
      - CESIUM_ION_TOKEN=${_CESIUM_ION_TOKEN}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/project-494b9eee-ced6-4525-aa8/gev/gods-eye-view:v20
  _GOOGLE_MAPS_API_KEY: ''
  _CESIUM_ION_TOKEN: ''
options:
  # No machineType override: a new account has no quota for the larger types
  # ("due to quota restrictions, Cloud Build cannot run builds of this machine
  # type in this region"). The default is slower but always available.
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
